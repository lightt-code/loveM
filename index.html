<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I love you, M</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:linear-gradient(135deg,#8d2f57,#6e255f 52%,#4b235d);color:#fff;font-family:Arial,sans-serif}
#heart{position:relative;width:100vw;height:100vh}
.l{position:absolute;left:50%;top:50%;font-size:clamp(9px,1.65vw,16px);font-weight:700;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(.5);animation:in 1.8s ease forwards}
.m{position:absolute;left:50%;top:50%;font-size:clamp(42px,12vw,100px);font-weight:900;opacity:0;text-shadow:0 0 22px #ffb1d2;animation:show 2s ease 5.8s forwards}
@keyframes in{to{opacity:.9;transform:translate(-50%,-50%) scale(1)}}
@keyframes show{to{opacity:1}}
</style>
</head>
<body>
<div id="heart"></div>
<script>
const h=document.getElementById('heart'),n=82;
for(let i=0;i<n;i++){
 let t=Math.PI*2*i/n,x=16*Math.sin(t)**3,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
 let e=document.createElement('span');e.className='l';e.textContent='i love you';
 e.style.left=(50+x*1.8)+'%';e.style.top=(50+y*1.8)+'%';e.style.animationDelay=(i*.075)+'s';h.appendChild(e)
}
let m=document.createElement('div');m.className='m';m.textContent='M';h.appendChild(m)
</script>
</body>
</html>
